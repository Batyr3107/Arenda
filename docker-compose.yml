version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: arenda_postgres
    environment:
      POSTGRES_USER: arenda_user
      POSTGRES_PASSWORD: arenda_password
      POSTGRES_DB: arenda
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arenda_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: arenda_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: arenda_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
      - ./uploads:/app/uploads
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://arenda_user:arenda_password@postgres:5432/arenda
      DATABASE_URL_SYNC: postgresql://arenda_user:arenda_password@postgres:5432/arenda
      REDIS_URL: redis://redis:6379/0

volumes:
  postgres_data:
